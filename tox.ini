# Runs all three unit suites plus lint.
#
#   tox              -> shared, machine and k8s suites
#   tox -e lint      -> ruff check
#   tox -e format    -> ruff format --check
#   tox -e docs      -> codespell + mdformat --check
#   tox -e shared    -> jaime-package suite only
#
# The shared suite needs `ops` even though it tests substrate-independent
# code: tests/test_core.py drives CoreMixin through a dummy CharmBase, so
# CoreMixin is covered once rather than duplicated into both charm suites.

[tox]
skipsdist = True
envlist = lint, docs, shared, machine, k8s

[testenv]
skip_install = True
deps =
    pytest
    pytest-cov
    ops >= 2.10.0

[testenv:shared]
description = Unit tests for the shared jaime-package library
changedir = {toxinidir}
commands =
    pytest {posargs:tests/unit/ --cov=jaime-package --cov-report=term-missing}

[testenv:machine]
description = Unit tests for the machine subordinate charm
changedir = {toxinidir}/charms/machine
commands =
    pytest {posargs:tests/ --cov=src --cov-report=term-missing}

[testenv:k8s]
description = Unit tests for the Kubernetes standalone charm
changedir = {toxinidir}/charms/k8s
commands =
    pytest {posargs:tests/ --cov=src --cov-report=term-missing}

[testenv:lint]
description = Lint all Python sources
deps = ruff
commands =
    ruff check {posargs:.}

[testenv:format]
description = Check formatting without rewriting files
deps = ruff
commands =
    ruff format --check --diff {posargs:.}

[testenv:docs]
description = Check documentation spelling and Markdown formatting
deps =
    codespell
    mdformat
commands =
    codespell {posargs:.}
    mdformat --check README.md docs/

# Integration tests drive a real Juju controller and are never part of
# envlist. Requires a bootstrapped controller and `make pack-all` output
# in dist/.
[testenv:integration]
description = Integration tests against a live Juju controller
changedir = {toxinidir}
deps = -r tests/integration/requirements.txt
passenv =
    HOME
    JUJU_*
    JAIME_TEST_*
commands =
    pytest {posargs:tests/integration/ -v}
