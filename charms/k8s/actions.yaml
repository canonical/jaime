show-status:
  description: "Show the current monitoring state for every watched application unit: workload, active incident if any, and last observation. Returns a JSON array under 'result'."
  params: {}
  results:
    result:
      type: string
      description: "JSON array of per-unit records: unit, workload, first-seen, status-since, increment, last-reported, incident-id, incident-opened-at."
show-usage:
  description: "Show AI token usage and cost. Returns a global summary across all incidents, or per-incident detail if incident-id is provided."
  params:
    incident-id:
      type: string
      default: ""
      description: "Incident ID to filter by. If empty, returns the global summary."
show-setup-steps:
  description: "Print the exact setup steps for this charm: Kubernetes RBAC, Juju observer user, secrets, and configuration. Read-only."
  params: {}
get-suggestion:
  description: "Return the AI suggestion for the current open incident."
  params:
    additional-context:
      type: string
      default: ""
      description: "Extra context to include in the AI prompt."
generate-report:
  description: "Generate and return a Markdown report for the current open incident."
  params: {}
reset:
  description: "Clear all tracked incidents and status state."
  params: {}
