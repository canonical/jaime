options:
  mode:
    type: string
    description: >
      Operating mode.
      'observe': collect context and generate reports only.
      'suggest': like observe, plus calls the AI provider to append diagnosis
        and safe manual remediation suggestions to the report. Nothing is executed.
      'act': NOT YET IMPLEMENTED. Setting mode to 'act' puts the charm in
        blocked state until command allowlisting is implemented.
    default: observe
  provider:
    type: string
    description: >
      AI provider to use for optional report generation. Allowed values:
      'none' (no provider; the charm always produces a non-AI report),
      'gemini', 'openrouter', or 'remote' (any server that speaks the OpenAI
      Chat Completions protocol, e.g. Ollama; requires 'provider-remote-url').
    default: none
  model:
    type: string
    description: >
      AI model to use with the selected provider (optional). Any model the
      provider supports is accepted. When empty, a provider default is used:
      'gemini-2.5-flash' for gemini and '~deepseek/deepseek-v4-flash-latest'
      for openrouter. 'remote' has no provider default, so the model must be
      set (for Ollama, an exact pulled tag). Ignored when provider is 'none'.
    default: ""
  provider-remote-url:
    type: string
    description: >
      Base URL of the AI provider endpoint for the 'remote' provider
      (OpenAI-compatible servers only). For Ollama, the OpenAI-compatible root
      is http://<host>:11434/v1. Required when provider is 'remote'; setting it
      with 'gemini' or 'openrouter' blocks the unit; ignored when provider is
      'none'.
    default: ""
  api-token:
    type: string
    description: >
      API token for the configured AI provider. Accepts either a Juju secret URI
      (``secret:<id>``, recommended) or a plain token string (for development only).
      When a secret URI is provided, Jaime reads the ``token`` field from the secret
      content. The token is never logged. Optional for the 'remote' provider: a
      local server that does not require authentication works without one. To
      use a secret: run
      ``juju add-secret jaime-token token=<value>``, grant it to the application,
      then set this field to the returned secret URI.
    default: ""
  watch-statuses:
    type: string
    description: "Comma-separated unit workload statuses that should open an incident."
    default: "error,blocked"
  failure-timeout-minutes:
    type: int
    description: "How long a watched status must persist before a report is generated."
    default: 5
  cooldown-minutes:
    type: int
    description: "Minimum time between reports for the same unresolved incident. While a unit stays unhealthy, Jaime keeps one incident and writes a refreshed report version each time this period elapses, without calling the AI provider."
    default: 30
  log-window-minutes:
    type: int
    description: "How far back Jaime should collect recent logs (minutes)."
    default: 30
  max-context-lines:
    type: int
    description: "Per-item cap on collected lines. Some sections apply a tighter cap (for example socket statistics and firewall rules). This is not a report or prompt total."
    default: 500
  max-prompt-bytes:
    type: int
    description: >
      Byte budget for the prompt built from the stored report in suggest/act
      mode. The report itself is never bounded by this; only the copy sent to
      the AI provider is. Tier-1 content (executive summary, recent logs,
      failure indicators, available actions, charm links) is always included
      and only individually capped; tier-2 content (processes, network ports,
      plan log files, snap status, health commands) is included while the
      budget allows and otherwise named as omitted; tier-3 content (disk,
      memory, network connections, firewall rules, charm config) is always
      reduced to a short digest, regardless of this budget. 0 disables
      projection: the full report is sent as the prompt.
    default: 60000
  report-dir:
    type: string
    description: "Directory where Markdown report artifacts are written: <incident-id>.md for the first report, <incident-id>-<UTC timestamp>.md for refreshed versions."
    default: /var/log/jaime/reports
  audit-log-path:
    type: string
    description: "Path to the structured JSONL audit log. Rotated at 10 MiB, keeping five numbered archives (<path>.1 is the newest)."
    default: /var/log/jaime/events.jsonl
  diagnostics:
    type: string
    description: >
      JSON monitoring plan describing what to collect (log files, processes,
      env vars, network ports, systemd units, health commands). A plan set
      here is applied on config-changed; an invalid one blocks the unit. The
      log_files, processes, env_variables and network sections are required
      (they may be empty). When empty, Jaime attempts to generate this plan
      via AI on relation-joined, and again when the option is cleared. See
      the diagnostic schema in src/jaime/diagnostics.py for the expected format.
    default: ""
  watch-applications:
    type: string
    description: >
      Comma-separated application names whose units on this machine should be
      watched in addition to the principal. The principal is always watched.
      Empty (the default) watches only the principal and opens no controller
      connection, so no credentials are needed. Use "*" to watch every
      co-located unit. Reach is bounded to units on this machine, because the
      collectors read the local host; units on other machines are never
      reported on. A configured name with no unit on this machine is skipped
      silently.
    default: ""
  juju-api-user:
    type: string
    description: >
      Name of a Juju user with 'read' permission on this model, used to fetch
      workload statuses for co-located units from the controller API. A unit's
      own agent identity does not have this permission. Only required when
      watch-applications is non-empty. Create with:
        juju add-user jaime-observer
        juju grant jaime-observer read <model-name>
    default: ""
  juju-api-password:
    type: string
    description: >
      Password for the juju-api-user. Accepts either a Juju secret URI
      (``secret:<id>``, recommended) or a plain string (development only).
      When a secret URI is provided, Jaime reads the ``password`` field from
      the secret content.
    default: ""
