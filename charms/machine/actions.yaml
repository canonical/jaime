diagnose:
  description: "Collect basic information about the related principal charm (read-only)."
  params: {}
collect-context:
  description: "Write a bounded context bundle to disk and return its path."
  params: {}
generate-report:
  description: "Generate and return a Markdown report for the current open incident. Fails if no incident is open."
  params: {}
get-suggestion:
  description: "Return the AI suggestion for the current open incident. Fails if no incident is open or no suggestion has been generated yet."
  params:
    additional-context:
      type: string
      default: ""
      description: "Extra context to include in the AI prompt (e.g. juju config, replication status)."
show-status:
  description: "Show the current monitoring state for every monitored unit: workload, active incident if any, and last observation. Returns a JSON array under 'result'."
  params: {}
  results:
    result:
      type: string
      description: "JSON array of per-unit records: unit, workload, first-seen, status-since, increment, last-reported, incident-id, incident-opened-at."
show-usage:
  description: "Show AI token usage and cost. Returns a global summary across all incidents, or per-incident detail if incident-id is provided."
  params:
    incident-id:
      type: string
      default: ""
      description: "Incident ID to filter by. If empty, returns the global summary."
reset:
  description: "Clear all tracked incidents and status state. Use to start fresh after a resolved incident."
  params: {}
