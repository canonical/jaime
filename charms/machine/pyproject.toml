[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jaime"
version = "0.0.7"
description = "Jaime - Juju AI Medic Engine (machine subordinate)"
requires-python = ">=3.10"
dependencies = [
    "ops>=2.10.0",
    "websocket-client>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".vendored/jaime-package"]

[tool.coverage.run]
source = ["src", ".vendored/jaime-package"]
