name: jaime
type: charm
title: Jaime
subordinate: true
summary: Jaime - Juju AI Medic Engine
description: |
  Jaime is a Juju machine subordinate charm that observes related principal units,
  collects bounded diagnostic context, writes structured incident reports and optionally calls third party LLM for suggestion of fixes/troubleshooting
links:
  contact:
    - ljupcho.vangelski@canonical.com
    - gaetan.gouzi@canonical.com
  documentation: https://canonical-jaime-charm.readthedocs-hosted.com
  issues:
    - https://github.com/canonical/jaime/issues
  source:
    - https://github.com/canonical/jaime

version: "0.1.0"
requires:
  principal:
    interface: juju-info
    scope: container

platforms:
  ubuntu-22.04-amd64:
    build-on:
      - ubuntu@22.04:amd64
    build-for:
      - ubuntu@22.04:amd64
  ubuntu-22.04-arm64:
    build-on:
      - ubuntu@22.04:arm64
    build-for:
      - ubuntu@22.04:arm64

  ubuntu-24.04-amd64:
    build-on:
      - ubuntu@24.04:amd64
    build-for:
      - ubuntu@24.04:amd64
  ubuntu-24.04-arm64:
    build-on:
      - ubuntu@24.04:arm64
    build-for:
      - ubuntu@24.04:arm64

  ubuntu-26.04-amd64:
    build-on:
      - ubuntu@26.04:amd64
    build-for:
      - ubuntu@26.04:amd64
  ubuntu-26.04-arm64:
    build-on:
      - ubuntu@26.04:arm64
    build-for:
      - ubuntu@26.04:arm64

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    override-build: |
      cp -r _jaime-package/jaime/. src/jaime/
      craftctl default
  icon:
    plugin: dump
    source: .
    stage:
      - icon.svg
    prime:
      - icon.svg

analysis:
  ignore:
    linters:
      - entrypoint
